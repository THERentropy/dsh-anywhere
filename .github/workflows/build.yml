name: Build

# 推送到任意分支即自动触发(验证门禁 + 单元测试 + 产出可安装的 debug APK),
# 产物以 Artifact 形式挂在该次运行的页面上,可随时下载安装。
# 打 v* 标签的正式发行仍由 release.yml 负责;本工作流只响应分支推送,
# 不响应标签,两者不会重复构建。
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一分支连续推送时只保留最新一次构建,旧的自动取消。
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run verification gates and unit tests
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew checkLegacyRoutes testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          source_apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          if [ -z "${source_apk}" ]; then
            echo "::error::assembleDebug produced no APK."
            exit 1
          fi
          short_sha="${GITHUB_SHA::7}"
          apk="DSH-Agents-debug-${short_sha}.apk"
          cp "${source_apk}" "${apk}"
          sha256sum "${apk}" | tee "${apk}.sha256"
          {
            echo "apk=${apk}"
            echo "artifact_name=DSH-Agents-debug-${short_sha}"
          } >> "${GITHUB_OUTPUT}"
          echo "| APK | \`${apk}\` |" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact_name }}
          path: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.apk }}.sha256
          if-no-files-found: error
